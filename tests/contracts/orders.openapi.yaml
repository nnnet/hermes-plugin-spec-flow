openapi: 3.0.0
info: {title: Marketplace orders API, version: 1.0.0}
paths:
  /orders:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  orders: {type: string}
                  total: {type: integer}
  /orders/export:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  url: {type: string}
