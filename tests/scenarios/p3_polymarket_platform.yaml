# Project 3 — legitimate research framing: a self-improving platform targeting
# ROI / Sharpe on a prediction market. Imprecise L0 is an unsupervised
# real-money autonomous trader with jurisdiction exposure and no targets.
name: p3-prediction-market-platform
node_engine: inline   # node lifecycle engine (run config, as Hermes would pass it)
goal: "Саморазвивающаяся платформа: ROI от депозита и коэффициент Шарпа на prediction-market"
imprecision: >
  "Self-developing platform that earns" implies autonomous real-money trades
  with no human gate and unreviewed jurisdiction/ToS, and no numeric ROI/Sharpe
  target.
imprecise:
  title: "Autonomous earning platform — targets/limits/jurisdiction unspecified"
  metrics: {modules: 5, tasks: 16, interfaces: 3, estimated_loc: 2500, open_decisions: 2, single_concern: false, testable_criteria: false}
  policy: {measurable_target: false, spend_per_action_usd: 1000, human_in_loop: false, involves_outreach: false, consent_obtained: true, legal_exposure: true, legality_reviewed: false}
  expect_policy: block
  expect_leaf: branch
resolved:
  title: "Strategy research + backtest: target ROI >= X%, Sharpe >= Y on historical data; live trades human-approved <= $50; jurisdiction reviewed"
  metrics: {modules: 5, tasks: 16, interfaces: 3, estimated_loc: 2500, open_decisions: 0, single_concern: false, testable_criteria: true}
  policy: {measurable_target: true, spend_per_action_usd: 50, human_in_loop: true, involves_outreach: false, consent_obtained: true, legal_exposure: true, legality_reviewed: true}
  expect_policy: pass
  expect_leaf: branch
template_must_catch:
  - numeric ROI/Sharpe acceptance target
  - autonomous real-money spend gated by a human
  - jurisdiction/ToS exposure reviewed

# ---- full-run surface (the RESOLVED goal — only it may be decomposed) -------
constitution:
  - "All strategy evaluation is on historical data until targets are met."
  - "Any live trade above $50 requires explicit human approval."
  - "Jurisdiction and platform ToS are reviewed before live mode."
target: "Backtest: ROI >= X% and Sharpe >= Y on 2 years of history; live trades human-approved <= $50."
policy: {measurable_target: true, spend_per_action_usd: 50, human_in_loop: true, involves_outreach: false, consent_obtained: true, legal_exposure: true, legality_reviewed: true}

blueprint:
  id: L0
  title: "Prediction-market research platform (backtest-first)"
  metrics: {modules: 5, tasks: 16, interfaces: 3, estimated_loc: 2500, open_decisions: 0, single_concern: false, testable_criteria: true}
  children:
    - id: data_ingest
      title: "Market data ingestion (historical)"
      spike: {question: "Order-book snapshots vs trade ticks for backtesting?", recommendation: "Trade ticks + daily book snapshots — enough for the target horizon"}
      metrics: {modules: 1, tasks: 4, interfaces: 1, estimated_loc: 90, open_decisions: 0, single_concern: true, testable_criteria: true}
    - id: strategy
      title: "Strategy & risk research"
      metrics: {modules: 2, tasks: 6, interfaces: 1, estimated_loc: 420, open_decisions: 0, single_concern: false, testable_criteria: true}
      children:
        - id: backtest
          title: "Backtest engine (fees & slippage modelled)"
          review_fails: 1
          metrics: {modules: 1, tasks: 4, interfaces: 1, estimated_loc: 95, open_decisions: 0, single_concern: true, testable_criteria: true}
        - id: risk_model
          title: "Risk model (drawdown, exposure caps)"
          metrics: {modules: 1, tasks: 3, interfaces: 1, estimated_loc: 80, open_decisions: 0, single_concern: true, testable_criteria: true}
    - id: execution_gate
      title: "Human-gated execution"
      clarify: {decision: "Approval UX: per-trade confirm vs daily batch review?", resolution: "Per-trade confirm above $10, daily batch below"}
      metrics: {modules: 1, tasks: 3, interfaces: 1, estimated_loc: 75, open_decisions: 0, single_concern: true, testable_criteria: true}
    - id: reporting
      title: "ROI / Sharpe reporting"
      metrics: {modules: 1, tasks: 3, interfaces: 1, estimated_loc: 70, open_decisions: 0, single_concern: true, testable_criteria: true}

# fee-model change on the platform invalidates the strategy subtree
revision:
  trigger: on_level_return
  finding: "Platform fee model changed (maker rebate removed) — backtest assumptions invalid."
  invalidates: strategy
  effect: "Version-bump strategy spec, re-derive backtest/risk_model under the new fee model."

# ---- smart verification oracle ----------------------------------------------
# Declared OUTCOME invariants — checked against the realized RunResult, not a
# 1:1 copy of the tree above. See tests/harness/oracle.py.
oracle:
  min_depth: 2
  max_depth: 3
  # anchors: historical data ingestion, the strategy research branch (later
  # revised), the human-gated execution node, and ROI/Sharpe reporting.
  anchor_nodes: [data_ingest, strategy, execution_gate, reporting]
  # this case additionally exercises the continuous-revision lane.
  expected_episodes: [spike, clarify, review_critique, revision]
  expected_loops: {clarify: 1, review_fail: 1, revision_respec: 1}
  coverage: {min_skills: 7, min_profiles: 5}
  research_before_impl: true
