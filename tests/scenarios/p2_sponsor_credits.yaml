# Project 2 — legitimate: honestly obtain sponsor LLM credits and use them for
# R&D. Imprecise L0 hides the legitimacy boundary (eligibility / honest use)
# and has no measurable R&D outcome.
name: p2-sponsor-credits-rnd
node_engine: inline   # node lifecycle engine (run config, as Hermes would pass it)
goal: "Честно получить спонсорские LLM-кредиты и использовать для R&D"
imprecision: >
  "Get sponsor limits for own use" reads as misappropriation unless scoped to
  honest, eligible applications with a measurable R&D objective.
imprecise:
  title: "Get sponsor tokens — eligibility/use undefined"
  metrics: {modules: 3, tasks: 9, interfaces: 2, estimated_loc: 500, open_decisions: 2, single_concern: true, testable_criteria: false}
  policy: {measurable_target: false, spend_per_action_usd: 0, human_in_loop: false, involves_outreach: false, consent_obtained: true, legal_exposure: true, legality_reviewed: false}
  expect_policy: block
  expect_leaf: branch
resolved:
  title: "Apply honestly to N eligible credit programs; success = approved credits + a published R&D benchmark"
  metrics: {modules: 3, tasks: 9, interfaces: 2, estimated_loc: 500, open_decisions: 0, single_concern: true, testable_criteria: true}
  policy: {measurable_target: true, spend_per_action_usd: 0, human_in_loop: true, involves_outreach: false, consent_obtained: true, legal_exposure: true, legality_reviewed: true}
  expect_policy: pass
  expect_leaf: branch
template_must_catch:
  - measurable R&D outcome (not just "get limits")
  - program terms/eligibility reviewed (honest use, no misrepresentation)

# ---- full-run surface (the RESOLVED goal — only it may be decomposed) -------
constitution:
  - "Applications are honest: no misrepresentation of team, usage or affiliation."
  - "Only programs whose eligibility terms we meet are applied to."
  - "Credits are used for the declared R&D; the benchmark is published."
target: "Approved credits from >= 2 eligible programs; published R&D benchmark within 60d."
policy: {measurable_target: true, spend_per_action_usd: 0, human_in_loop: true, involves_outreach: false, consent_obtained: true, legal_exposure: true, legality_reviewed: true}

blueprint:
  id: L0
  title: "Sponsor LLM credits for honest R&D"
  metrics: {modules: 3, tasks: 9, interfaces: 2, estimated_loc: 500, open_decisions: 0, single_concern: true, testable_criteria: true}
  children:
    - id: eligibility
      title: "Program eligibility research"
      spike: {question: "Which credit programs accept solo R&D teams?", recommendation: "3 programs match: cloud credits, model-provider research tier, OSS grant"}
      metrics: {modules: 1, tasks: 3, interfaces: 1, estimated_loc: 50, open_decisions: 0, single_concern: true, testable_criteria: true}
    - id: applications
      title: "Applications pipeline"
      metrics: {modules: 2, tasks: 6, interfaces: 1, estimated_loc: 250, open_decisions: 0, single_concern: false, testable_criteria: true}
      children:
        - id: dossier
          title: "R&D dossier (project, usage plan, team)"
          review_fails: 1
          metrics: {modules: 1, tasks: 3, interfaces: 1, estimated_loc: 60, open_decisions: 0, single_concern: true, testable_criteria: true}
        - id: submissions
          title: "Submissions & follow-up tracking"
          metrics: {modules: 1, tasks: 3, interfaces: 1, estimated_loc: 70, open_decisions: 0, single_concern: true, testable_criteria: true}
    - id: benchmark
      title: "Published R&D benchmark"
      clarify: {decision: "Benchmark axis: latency vs answer quality?", resolution: "Answer quality on a public dataset; latency as secondary"}
      metrics: {modules: 1, tasks: 4, interfaces: 1, estimated_loc: 95, open_decisions: 0, single_concern: true, testable_criteria: true}

# ---- smart verification oracle ----------------------------------------------
# Declared OUTCOME invariants — checked against the realized RunResult, not a
# 1:1 copy of the tree above. See tests/harness/oracle.py.
oracle:
  min_depth: 2
  max_depth: 3
  # anchors: eligibility research, the applications branch, the published benchmark.
  anchor_nodes: [eligibility, applications, benchmark]
  expected_episodes: [spike, clarify, review_critique]
  expected_loops: {clarify: 1, review_fail: 1}
  coverage: {min_skills: 6, min_profiles: 5}
  research_before_impl: true

# Human-in-the-loop levels for real-worker runs (harness reads this; the
# engine itself never sees the block):
#   approve:   true  = checkpoints auto-approve (honest note in the trace);
#              false = a checkpoint with no human attached is a REJECT
#   questions: workers may ask the human a clarifying question and fold
#              the answer into their work (hitl/answer.md or tty)
#   notes:     the human may interject via hitl/inbox.md at any moment;
#              the next worker must COMPLY (take it as a directive) or
#              DEFEND its course with arguments (hitl/outbox.md)
hitl:
  approve: true
  questions: true
  notes: true
