  metrics: {modules: 3, tasks: 9, interfaces: 2, estimated_loc: 500, open_decisions: 2, single_concern: true, testable_criteria: false}
  policy: {measurable_target: false, spend_per_action_usd: 0, human_in_loop: false, involves_outreach: false, consent_obtained: true, legal_exposure: true, legality_reviewed: false}
  expect_policy: block
  expect_leaf: branch
resolved:
  title: "Apply honestly to N eligible credit programs; success = approved credits + a published R&D benchmark"
  metrics: {modules: 3, tasks: 9, interfaces: 2, estimated_loc: 500, open_decisions: 0, single_concern: true, testable_criteria: true}
  policy: {measurable_target: true, spend_per_action_usd: 0, human_in_loop: true, involves_outreach: false, consent_obtained: true, legal_exposure: true, legality_reviewed: true}
