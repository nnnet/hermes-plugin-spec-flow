# Project 5 — the PRODUCT case. The workers must produce the whole app
# themselves: entry point, routing, persistence AND the acceptance suite.
# Nothing is seeded — no skeleton, no ready-made smoke tests — so the run
# measures real, unaided capability (scaffolding a case to pass is forbidden).
# NOTE: the former seeded smoke suite WAS this case's acceptance contract;
# until an `acceptance:`/`oracle:` block is added, this case has no product
# gate and needs a redesign before it can verify success.
name: p5-mvp-marketplace
node_engine: fsm
goal: >
  Рабочий MVP-маркетплейс: продавец регистрируется, выкладывает товар,
  покупатель находит его и покупает, продавцу начисляется выплата —
  всё как одно запускаемое приложение.
target: >
  tests/smoke/test_mvp_smoke.py is green on the assembled app:
  seller registered -> product listed -> found via search -> order paid
  (stub PSP) -> payout recorded for the seller.

policy: {measurable_target: true, spend_per_action_usd: 0, human_in_loop: true,
         involves_outreach: false, consent_obtained: true,
         legal_exposure: false, legality_reviewed: true}

constitution:
  - "Standard library ONLY: HTTP through WSGI (src/app.py exposes wsgi_app),
     storage through sqlite3 via src/db.py. No third-party packages anywhere."
  - "Every feature is one module src/<feature>.py that registers endpoints
     with @registry.route(METHOD, PATH), declares tables via
     db.register_schema(SQL); a handler takes (payload, query) and returns
     (status_code, json_serialisable)."
  - "The product API contract is FROZEN by the smoke suite: POST /sellers,
     POST /products, GET /products?search=, POST /orders,
     GET /payouts?seller_id= — exactly as tests/smoke/test_mvp_smoke.py
     exercises them. Do not rename, do not extend the contract. ALL FIVE
     endpoints must exist in the assembled product — each owned by a leaf."
  - "Status codes are contractual: every successful POST (creation) returns
     201; every successful GET returns 200. POST /orders responds
     {id, status: 'paid'}; GET /payouts responds {items: [{order_id,
     amount_cents, status}]} with amount_cents equal to the product price."
  - "Request payloads are contractual — accept EXACTLY these fields, no
     extras required: POST /sellers takes {name, email} and responds
     {id, kyc_status: 'verified', ...}; POST /products takes {seller_id,
     title, price_cents} (the field is TITLE — never name/description) and
     responds {id, ...}; GET /products?search= matches against title and
     responds {items: [{id, seller_id, title, price_cents}]};
     POST /orders takes {product_id, buyer_email}."
  - "Payments and KYC are internal stubs with honest interfaces: KYC
     auto-verifies, the PSP auto-captures; no external providers, no card
     data stored."
  - "Every test sets the MARKETPLACE_DB env var to a fresh temp path BEFORE
     connecting (db.connect reads it per call)."

# HITL: автономный аппрув; воркеры могут спрашивать, человек может вмешаться.
hitl:
  approve_required: false
  worker_may_ask_human: true
  human_may_intervene: true

# Ревью-политика: доработка до зелёного, до 3 раундов на узел.
review:
  on_reject: rework
  max_rework: 3

# Workers: this case carries its OWN run config — transport, model chains and
# tree-shaping knobs — so it runs self-contained (no live-run.env.sh, no
# exported env). configure_workers applies it over the tests/.test.env floor.
workers:
  # transport — Bifrost speaks the OpenAI protocol; free OpenRouter pool
  backend: openai
  base_url: http://127.0.0.1:8080/v1
  retries: 6
  # tree shaping (override the .test.env floor for a live run)
  leaf_depth: 3
  max_children: 4
  max_decompose_calls: 80
  creator_ensemble: 2
  concurrency: 3
  cycle_models: true
  quota_wait_s: 300
  quota_retries: 11
  fallback_models: [claude/haiku]
  providers:
    - {name: openrouter-free, kind: openai, model_prefix: "openrouter/", require_suffix: ":free", requests_per_day: 1000}
    - {name: claude-cli, kind: claude, model_prefix: "claude/"}
  defaults:
    models: ["openrouter/qwen/qwen3-coder:free", "claude/haiku"]
  decomposer:
    models: ["openrouter/qwen/qwen3-next-80b-a3b-instruct:free", "claude/haiku"]
  implementer:
    models: ["openrouter/qwen/qwen3-coder:free", "openrouter/deepseek/deepseek-chat-v3.1:free", "claude/haiku"]
  reviewer:
    models: ["claude/haiku", "openrouter/qwen/qwen3-next-80b-a3b-instruct:free"]
  verifier:
    models: ["claude/haiku", "openrouter/qwen/qwen3-coder:free"]

