# Project 4 — the FULL exercise case. Combines BOTH test surfaces:
#   (a) the policy surface (imprecise/resolved variants, like p1-p3) — the
#       deliberately vague L0 must be CAUGHT by policy_gate, not by a human;
#   (b) the full-run surface (tree/constitution/revision) — a 4-level tree that
#       drives EVERY skill, EVERY profile and EVERY control-flow path:
#       * 2 clarify/block loops (branch 'auth' + leaf 'payouts')
#       * 2 research spikes ('catalog' branch + 'notifications' leaf)
#       * 2 frozen L2 contracts ('orders', 'billing')
#       * BOTH drift classifications: contract_wrong ('ep_order_query' ->
#         respec-gate) and code_wrong ('invoicing' -> code fix, contract stands)
#       * review critique loops on 3 leaves (1x, 2x)
#       * a 4-level branch ('catalog/listings/...')
#       * continuous-revision lane invalidating 'billing' (version bump + re-derive)
name: p4-b2b-marketplace
node_engine: fsm      # full case runs through the state-machine lifecycle
goal: "B2B-маркетплейс восстановленного оборудования с выплатами продавцам"

# ---- (a) policy surface -----------------------------------------------------
imprecision: >
  "Sell refurbished gear and pay sellers automatically" — no measurable revenue
  target, unattended payouts with no cap or human gate, seller outreach without
  opt-in, warranty/liability law unreviewed.
imprecise:
  title: "Marketplace + auto-payouts — target/caps/consent/law unspecified"
  metrics: {modules: 7, tasks: 31, interfaces: 6, estimated_loc: 5200, open_decisions: 3, single_concern: false, testable_criteria: false}
  policy: {measurable_target: false, spend_per_action_usd: 800, human_in_loop: false, involves_outreach: true, consent_obtained: false, legal_exposure: true, legality_reviewed: false}
  expect_policy: block
  expect_leaf: branch
resolved:
  title: "GMV >= $20k/90d; payouts <= $50/action human-gated; opt-in seller outreach; warranty/liability ToS reviewed"
  metrics: {modules: 7, tasks: 31, interfaces: 6, estimated_loc: 5200, open_decisions: 0, single_concern: false, testable_criteria: true}
  policy: {measurable_target: true, spend_per_action_usd: 50, human_in_loop: true, involves_outreach: true, consent_obtained: true, legal_exposure: true, legality_reviewed: true}
  expect_policy: pass
  expect_leaf: branch
template_must_catch:
  - measurable acceptance target (GMV)
  - unattended spend capped at $50/action
  - seller outreach requires consent (opt-in)
  - warranty/liability legal exposure reviewed

# ---- (b) full-run surface ---------------------------------------------------
constitution:
  - "Every payout is human-approved above the $50/action cap."
  - "Sellers are contacted only after explicit opt-in."
  - "Warranty and liability terms are reviewed before a category goes live."
  - "No card data is stored; payments go through the PSP only."
target: "GMV >= $20k in 90d; payout error rate < 0.1%; p95 checkout < 500ms."
policy: {measurable_target: true, spend_per_action_usd: 50, human_in_loop: true, involves_outreach: true, consent_obtained: true, legal_exposure: true, legality_reviewed: true}

# `blueprint` is EXECUTION INPUT for the deterministic decomposer — the plugin
# builds its task tree node-by-node from it (same agent interface the live LLM
# uses), it is NEVER read by the engine as a finished tree. The analysis
# reference (anchors/depth/episodes) is the `oracle:` block below.
blueprint:
  id: L0
  title: "B2B refurbished-gear marketplace"
  metrics: {modules: 7, tasks: 31, interfaces: 6, estimated_loc: 5200, open_decisions: 0, single_concern: false, testable_criteria: true}
  children:
    # upfront research FIRST: analogs/differentiation, then architecture/NFRs —
    # only then feature subtrees (audit rule R9 enforces this order)
    - id: market_research
      title: "Analogs & differentiation (build vs reuse)"
      spike: {question: "Existing B2B refurb marketplaces — reuse/white-label or build own? What is our unique value?", recommendation: "Build a thin own marketplace; differentiation = certified condition-grading + human-gated payouts; reuse PSP and a managed search engine"}
      metrics: {modules: 1, tasks: 3, interfaces: 1, estimated_loc: 40, open_decisions: 0, single_concern: true, testable_criteria: true}
    - id: architecture
      title: "Architecture & NFR baseline (DB, load, security)"
      clarify: {decision: "Relational vs document DB? Load target? Payout threat model?", resolution: "Postgres + outbox events; 100 rps, p95 500ms (from constitution); payouts as isolated least-privilege service"}
      metrics: {modules: 1, tasks: 4, interfaces: 1, estimated_loc: 60, open_decisions: 0, single_concern: true, testable_criteria: true}
    - id: auth
      title: "Accounts & access (buyers, sellers, ops)"
      clarify: {decision: "Own auth vs delegated OIDC for B2B SSO?", resolution: "Delegated OIDC + service accounts for ops"}
      metrics: {modules: 2, tasks: 6, interfaces: 2, estimated_loc: 260, open_decisions: 1, single_concern: false, testable_criteria: true}
      children:
        - id: signup
          title: "Seller onboarding & verification"
          review_fails: 1
          metrics: {modules: 1, tasks: 4, interfaces: 1, estimated_loc: 90, open_decisions: 0, single_concern: true, testable_criteria: true}
        - id: sessions
          title: "Session & role management"
          metrics: {modules: 1, tasks: 3, interfaces: 1, estimated_loc: 70, open_decisions: 0, single_concern: true, testable_criteria: true}
    - id: catalog
      title: "Catalog & search"
      spike: {question: "Faceted search: own index vs managed engine?", recommendation: "Managed engine, sync via outbox events"}
      metrics: {modules: 2, tasks: 8, interfaces: 2, estimated_loc: 540, open_decisions: 0, single_concern: false, testable_criteria: true}
      children:
        - id: search
          title: "Faceted search endpoint"
          metrics: {modules: 1, tasks: 4, interfaces: 1, estimated_loc: 95, open_decisions: 0, single_concern: true, testable_criteria: true}
        - id: listings
          title: "Listings management"
          metrics: {modules: 2, tasks: 5, interfaces: 1, estimated_loc: 210, open_decisions: 0, single_concern: false, testable_criteria: true}
          children:
            - id: listing_editor
              title: "Listing editor (condition grading)"
              metrics: {modules: 1, tasks: 3, interfaces: 1, estimated_loc: 85, open_decisions: 0, single_concern: true, testable_criteria: true}
            - id: media_upload
              title: "Photo upload & processing"
              review_fails: 2
              metrics: {modules: 1, tasks: 3, interfaces: 1, estimated_loc: 80, open_decisions: 0, single_concern: true, testable_criteria: true}
    - id: orders
      title: "Orders & checkout"
      # contract-wrong drift: the frozen contract said total:integer, reality
      # needs a string (decimal-safe) -> drift-gate -> respec-gate fixes the L2
      contract: {artifact: orders.openapi.yaml, fixed: orders_fixed.openapi.yaml, code_drift: code_orders_drift.json}
      metrics: {modules: 2, tasks: 7, interfaces: 2, estimated_loc: 380, open_decisions: 0, single_concern: false, testable_criteria: true}
      children:
        - id: ep_order_query
          title: "GET /orders (list & totals)"
          drift: {classify: contract_wrong}
          review_fails: 1
          metrics: {modules: 1, tasks: 4, interfaces: 1, estimated_loc: 95, open_decisions: 0, single_concern: true, testable_criteria: true}
        - id: ep_order_export
          title: "GET /orders/export"
          metrics: {modules: 1, tasks: 3, interfaces: 1, estimated_loc: 70, open_decisions: 0, single_concern: true, testable_criteria: true}
    - id: billing
      title: "Billing & seller payouts"
      # code-wrong drift: code returned total_cents as string; the frozen L2
      # stands, the CODE is fixed and re-checked (code_fixed)
      contract: {artifact: billing.openapi.yaml, fixed: billing.openapi.yaml, code_drift: code_billing_drift.json, code_fixed: code_billing_fixed.json}
      metrics: {modules: 2, tasks: 6, interfaces: 2, estimated_loc: 320, open_decisions: 0, single_concern: false, testable_criteria: true}
      children:
        - id: invoicing
          title: "Invoicing (totals in cents)"
          drift: {classify: code_wrong}
          metrics: {modules: 1, tasks: 4, interfaces: 1, estimated_loc: 90, open_decisions: 0, single_concern: true, testable_criteria: true}
        - id: payouts
          title: "Seller payouts (human-gated)"
          clarify: {decision: "Payout rail: SEPA batch vs PSP transfer API?", resolution: "PSP transfer API, batched daily, human approval > $50"}
          # HITL: real money leaves the system above the unattended cap -> a
          # human must approve before this node ships (constitution rule).
          hitl: {kind: spend, reason: "payouts above the $50/action cap need human approval"}
          metrics: {modules: 1, tasks: 4, interfaces: 1, estimated_loc: 95, open_decisions: 0, single_concern: true, testable_criteria: true}
    - id: notifications
      title: "Notifications (opt-in only)"
      spike: {question: "Digest vs instant notifications for B2B buyers?", recommendation: "Daily digest default, instant for order events"}
      metrics: {modules: 1, tasks: 4, interfaces: 1, estimated_loc: 85, open_decisions: 0, single_concern: true, testable_criteria: true}

# Two revision methods exercised here:
#   1. level_return — a PSD2/PSP rule change invalidates 'billing'; it fires the
#      moment the billing branch folds up and control returns to L0.
#   2. internal — mid-run, accumulated work surfaces a security finding that
#      invalidates the 'architecture' baseline; fires during the run (not on a
#      branch return) and re-derives the affected subtree.
revisions:
  - method: level_return
    trigger: on_level_return
    finding: "PSP policy change: payout transfers now require per-seller KYC level 2 before first payout."
    invalidates: billing
    effect: "Version-bump billing spec (supersedes v1), reopen its subtree, re-derive invoicing/payouts under the new KYC precondition."
  - method: internal
    trigger: every_n_tasks
    after_completed: 10
    finding: "Pen-test of the live design surfaces an IDOR risk in the access model — the architecture/NFR baseline must change."
    invalidates: architecture
    effect: "Version-bump the architecture baseline (add object-level authorization), re-derive dependent nodes."

# ---- smart verification oracle ----------------------------------------------
# The FULL-exercise oracle: this case must reach every methodology episode and
# control-flow loop. Still bounds + anchors + episodes, never a tree copy.
oracle:
  # p4's deepest branch (catalog/listings/listing_editor) reaches depth 3.
  min_depth: 3
  max_depth: 4
  # anchors: upfront analogs research, the architecture/NFR node, the frozen
  # contract node (orders), and the human-gated payouts node.
  anchor_nodes: [market_research, architecture, orders, payouts]
  # both drift classifications and the revision lane must all fire here.
  expected_episodes: [spike, clarify, contract, drift_respec, drift_codefix, review_critique, revision, revision_internal, revision_level_return, hitl, self_improve]
  expected_loops: {clarify: 2, review_fail: 2, drift_respec: 1, drift_codefix: 1, revision_respec: 2}
  # the full-surface case must exercise ALL skills and ALL profiles.
  coverage: {min_skills: 9, min_profiles: 7}
  research_before_impl: true

# ---- product acceptance (depth=product) -------------------------------------
# What "ready to use" means for this product. With only the bundled stub
# implementer (no real built app / entrypoint) the product check honestly
# reports NOT READY — a live implementer agent is what turns it green.
acceptance:
  # entrypoint intentionally omitted in the autonomous test: no real app is
  # built, so readiness must NOT be faked green.
  smoke:
    - "service starts and answers GET /health -> 200"
  e2e:
    - "create listing -> search finds it -> place order -> invoice totals in cents"
  metrics:
    - "p95 checkout < 500ms over 100 requests"
    - "payout error rate < 0.1%"
