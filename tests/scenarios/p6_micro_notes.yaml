# Project 6 — the MINIMAL end-to-end case. Its only purpose is to exercise the
# whole live pipeline in the least wall-clock time:
#   * fsm engine + an LLM-built tree (no blueprint)
#   * a real code build verified by pytest at execute depth
#   * a mid-run HITL requirement injection (web_ui) that must materialise
#   * a working server-rendered web UI delivered at the root
# The product surface is deliberately tiny (a 2-endpoint notes service) so the
# tree the model builds is small — fewer nodes ⇒ fewer spec reviews, which the
# ⏱ analysis showed is ~47% of wall-clock. Depth/width are NOT hard-capped;
# the small goal keeps the tree small on its own.
#
# Nothing is seeded — no skeleton, no ready-made code. The `acceptance:` block
# is the declarative oracle (success criteria), not an implementation. Workers
# build the whole service themselves; this measures real, unaided capability.
name: p6-micro-notes
node_engine: fsm

# Parallel sibling leaves: up to 3 leaves of a branch build at once. HARD RULE —
# parallel workers MUST be physically isolated: each leaf builds in its OWN git
# worktree and merges back with a merge-tree pre-flight (no shared-dir dups).
parallel: {children: 3}
isolation: worktree

goal: >
  A tiny notes service. Two HTTP endpoints over a WSGI app:
  POST /notes accepts {"text": "..."} and stores it, returning {"id": <int>};
  GET /notes returns {"items": [{"id": <int>, "text": "..."}]} newest-first.
  Persistence is sqlite3; standard library only.

target: >
  POST then GET round-trips a note; the service starts and answers GET /health
  with 200. Binary success — the acceptance suite is green on the assembled app.

policy: {measurable_target: true, spend_per_action_usd: 0, human_in_loop: true,
         involves_outreach: false, consent_obtained: true, legal_exposure: false,
         legality_reviewed: true}

constitution:
  - "Standard library ONLY: HTTP through a WSGI app (src/app.py exposes
     `wsgi_app`), storage through sqlite3 in src/db.py. No third-party packages."
  - "The product API contract is FROZEN: POST /notes takes {text} and responds
     {id}; GET /notes responds {items: [{id, text}]} newest-first; GET /health
     responds 200. Accept exactly these fields — no extras required."
  - "Every test sets the NOTES_DB env var to a fresh temp path BEFORE connecting
     (db.connect reads it per call)."

# HITL: autonomous approval; workers may ask the human, the human may inject.
hitl:
  approve_required: false
  worker_may_ask_human: true
  human_may_intervene: true

# Autonomous HITL script — replayed by the dispatcher (tests/lib/hitl_dispatcher.py)
# so no human babysits the run. A human in HITL only states a requirement IN WORDS;
# proving it works is the SYSTEM's job (the worker writes the leaf AND its test,
# the root corpus runs it). So the injection carries ONLY a prose `statement:` —
# the same thing a person would type in the HITL box. No handed pytest.
injections:
  # Arm the semantic late-injection router (#2): красивый_вид is worded with NO
  # route/file/UI marker and overlaps both web_ui and db only on the shared
  # domain nouns (notes/list), so the deterministic detectors correctly ABSTAIN
  # — the strong-model router (reviewer chain, free-only) reads the candidate
  # specs and folds the presentation edit INTO web_ui instead of forking.
  llm_route: true
  requirements:
    - name: web_ui
      # Fire on the FIRST leaf implementation — reliable on any tree size, and
      # before the root integrate so the UI is part of the final product.
      # (integrate_passes:N is unreachable on a tiny tree with a single
      # root-level integrate, so the injection would never materialise.)
      when: {event: "minimal impl"}
      # The prose requirement a human would type (→ REQUIREMENT.md). What the
      # success looks like is stated in WORDS; the system must build it and
      # prove it works on its own.
      statement: |
        MINIMAL WEB INTERFACE (added by the human mid-run; binding).

        Serve a server-rendered HTML page, standard library only, as one feature
        leaf (src/web_ui.py) reusing the existing notes storage and /notes logic:

        - GET /ui  — an HTML page that lists all notes (newest first) and carries
                     an add form: a text input named "text" that POSTs back to /ui
                     and then shows the new note in the list.

        The WSGI app passes HTML strings through (return 200 + "<html>...").
        No JavaScript frameworks, no new storage, no API changes.

        Build it AND prove it works as part of the product — a page that serves
        HTML at /ui, shows the add form, and lists a note created through it.
    # SECOND human injection about the SAME web surface — fires LATER (after a
    # subtree integrate, so the web page already exists). The point of the
    # experiment: does the worker DISCOVER the existing /ui page and EDIT it in
    # place to satisfy this, or does it spawn a SECOND parallel web? Prose only.
    - name: красивый_вид
      # Same early trigger as web_ui: both must arrive BEFORE the root places
      # its children (a requirement injected after that phase is orphaned —
      # the engine reads standing requirements once). Within the placement
      # loop they are visited in injection order, so web_ui is fully built
      # before nice_ui's worker runs — nice_ui therefore meets an existing
      # web_ui.py and we can see whether it EDITS it or builds a parallel web.
      when: {event: "minimal impl"}
      # DELIBERATELY worded WITHOUT an easy UI marker — no "/ui", no "web", no
      # "ui", no filename. It only refers to the notes the reader sees. This
      # forces the engine's UNIVERSAL surface-overlap detectors (symbol/token
      # overlap, not a UI keyword list) to find the module that already renders
      # notes and route this edit INTO it — proving the match is not a /ui cheat.
      statement: |
        MAKE THE NOTES NICE TO READ (added by the human mid-run; binding).

        The notes that a reader sees should be presented in a clean, friendly,
        easy-to-read layout — a clear heading, a tidy list, a simple way to add
        one. Standard library only; improve the existing presentation rather
        than adding a separate one alongside it.
  # Randomised EXTRA requirements ON TOP of the baseline above. Each run draws a
  # different subset of `pool` (1-2 items) so late-requirement routing is tested
  # in the GENERAL case, not one fixed combination — some items OVERLAP a module
  # already built (must be routed INTO it), some are FRESH surfaces (a new file).
  # The draw is persisted to hitl/selection.json so a --resume replays the same
  # set. Set SPEC_FLOW_INJECT_SEED=<int> to reproduce a specific combination.
  select:
    enabled: true
    min: 1
    max: 2
  pool:
    - name: delete_note
      overlap: true            # extends the EXISTING notes API — route into it
      when: {event: "minimal impl"}
      statement: |
        ALLOW REMOVING A NOTE (added by the human mid-run; binding).

        A reader must be able to delete a single note by its id. Extend the
        existing notes capability — do not add a separate store. Deleting a note
        then listing must no longer show it. Build it AND prove it with a test
        through the public surface. Standard library only.
    - name: note_search
      overlap: true            # refines the EXISTING /notes listing
      when: {event: "minimal impl"}
      statement: |
        FIND NOTES BY WORD (added by the human mid-run; binding).

        When listing notes, a reader should be able to narrow the list to those
        containing a given word. Build on the existing notes listing rather than
        a new one; prove it with a test that adds a few notes and filters them.
        Standard library only.
    - name: about_page
      overlap: false           # a brand-new static surface, no storage
      when: {event: "minimal impl"}
      statement: |
        ADD AN ABOUT PAGE (added by the human mid-run; binding).

        Serve GET /about as a small server-rendered HTML page describing what
        this little notes service is. No storage, no API change — a standalone
        page. Standard library only (return 200 + an HTML string). Build it AND
        prove GET /about returns HTML.
    - name: ping_text
      overlap: false           # a brand-new tiny surface, no storage
      when: {event: "minimal impl"}
      statement: |
        ADD A LIVENESS PING (added by the human mid-run; binding).

        Serve GET /ping returning the plain text "pong" (content-type
        text/plain, status 200). It touches nothing else. Build it AND prove
        GET /ping returns exactly "pong". Standard library only.
  # HUMAN answer handed to the plugin ONLY when a worker actually asks, to
  # unblock without babysitting. STRICT anti-leak rule: NO solution hints — the
  # reply must NOT name the file/route/field/form/storage or otherwise design
  # the feature for the worker. Everything needed is already in the requirement
  # statement; the worker must read and derive it. A single neutral nudge only.
  answers:
    default: "Proceed with the simplest correct standard-library approach that satisfies the requirement as written; do not block on this."

# Review policy: rework to green, but a tight cap — review + repair are the
# two biggest time sinks, so bound them and let the gate fail loudly instead
# of grinding rounds.
# Doctor: cause-diagnosis + remedy dispatch (Ф3 advisory at scope-lint for now).
# enabled here so the p6 MVP exercises it; flip to false for a baseline compare.
doctor:
  enabled: true
causes:                  # override only what differs from DEFAULT_CAUSES (15)
  empty_delta:     {ladder: [reject_empty, rework, escalate_tier]}
  task_too_large:  {ladder: [split, record]}
evaluator:
  tier: strong          # mimo-v2.5-pro via workers.tiers
  temperature: 0.0
  votes: 1              # start at 1; log_vote_spread gathers data
  require_cite: true

review:
  on_reject: rework
  max_rework: 2

# B1/B2 — the honest hard floor. With pre_gate on, the ROOT integrate (L0) runs
# the un-mockable boot-gate: it ASSEMBLES the product in a fresh subprocess,
# boots its real WSGI entry and drives the acceptance endpoints (GET /health,
# GET /ui, POST+GET /notes round-trip). A product that does not actually boot or
# answer is RED even when the per-module pytest suite is green — so "L0 PASS"
# means a genuinely runnable product, not just passing unit tests. Default OFF
# (engine-wide) keeps p4/p5 unaffected; p6 opts in here.
integrate:
  pre_gate: true

# Acceptance oracle (declarative). The assembled app must satisfy these; the
# verifier turns them into the root gate. web_ui acceptance arrives mid-run via
# the HITL requirement injection, not here.
acceptance:
  smoke:
    - "service starts and answers GET /health -> 200"
  e2e:
    - "POST /notes {text:'hi'} -> {id}; GET /notes -> items contains that note"

# Workers: self-contained run config (transport + free model chains + knobs),
# tuned for minimum time. Applied over the tests/.test.env floor.
workers:
  backend: openai                       # Bifrost speaks the OpenAI protocol
  base_url: http://127.0.0.1:8080/v1
  # ARCHITECTURE RULE: every provider goes through Bifrost — claude too. claude/*
  # routes via this gateway (Bifrost anthropic provider → Meridian :3456 →
  # subscription), NOT a direct `claude -p` CLI. Bifrost serialises the anthropic
  # provider (concurrency:1 in infra/hermes/bifrost/config.json) so concurrent
  # claude calls queue instead of throttling each other into timeouts (v074/v075).
  # The runner preflight (run_cases.py) refuses to start if any provider bypasses
  # Bifrost or if this gateway / Meridian is unreachable.
  claude_gateway:
    base_url: http://127.0.0.1:8080/v1
    model_map:
      claude/sonnet: anthropic/claude-sonnet-4-6
      sonnet: anthropic/claude-sonnet-4-6
  retries: 6
  # per-call wall cap. Real generations here run ~16s; a dead/hung provider (mimo
  # 504s the Bifrost gateway holds ~120s) must NOT cost the 420s global default.
  # 75s leaves wide margin over real calls but bails a hung call as a client
  # timeout, which the per-model breaker now retires after ONE (v091: 25×~120s).
  timeout: 75
  leaf_depth: 3
  max_children: 3
  max_decompose_calls: 40
  creator_ensemble: 2
  max_concurrent_llm_requests: 3   # per-provider default in-flight cap
  # One universal per-provider gate (workers.provider_concurrency). claude rides
  # a subscription-rate-limited path (Bifrost -> Meridian -> Max): a single
  # codegen call is ~28s but THREE in flight throttle each other past the 75s
  # timeout (v097: 0/9 claude_ok -> weak fallback -> weak_implementer). Serialise
  # claude; every other provider keeps the shared default above and stays
  # parallel. Mirrors a Bifrost provider's own `concurrency`.
  provider_concurrency:
    claude: 1
    anthropic: 1
  # Per-provider per-call wall cap. A flaky free model fails fast at the 75s
  # default so a dead endpoint drops quickly; the capable workhorse needs longer
  # for a BIG codegen prompt over the subscription path (live v098: claude
  # prompts 9k-18k chars all timed out at 75s, 0/24 -> weak fallback). 180s lets
  # a real claude generation finish while still bailing a genuinely hung call.
  provider_timeout:
    claude: 180
    anthropic: 180
  # cycle_models: false  → STRICT primary-first: each chain's first model
  # (xiaomimimo/mimo-v2.5) is tried on every call, fallbacks only on failure. We
  # want mimo to carry the run so Xiaomi traffic is consistently visible IN
  # Bifrost (round-robin would spread ~1/3 of calls to haiku, which bypasses it).
  cycle_models: false
  # quota wait is a LAST resort (whole chain 429'd). Kept SHORT: leads are now
  # local lmstudio (no quota), so a 429 only happens if it AND mimo are down and
  # a free fallback is hit. A short wait beats minutes of idle (was 300×11 ≈ 55m).
  quota_wait_s: 20
  quota_retries: 3
  fallback_models: [claude/sonnet]
  # LLM power tiers. Model set RESTRICTED to THREE by operator request
  # (2026-06-24): claude/sonnet + xiaomimimo/mimo-v2.5 + xiaomimimo/mimo-v2.5-pro.
  # No haiku, no OpenRouter :free, no local lmstudio. claude/sonnet runs via the
  # subscription CLI (strong, reliable, NO quota/429 — spends no API budget, so it
  # passes the paid-model guard exactly like haiku did). mimo runs via Bifrost
  # (xiaomimimo provider, quota-bearing/free-class). Sonnet leads HARD generative
  # work; mimo leads CHECK gates (pro = the strongest, used by the final verify).
  # C (2026-07-02, operator): MIMO leads EVERY tier — no usage restriction, and
  # mimo parallelises where claude is single-laned (provider_concurrency
  # claude:1 → Bifrost anthropic concurrency:1 → Meridian), so parallel node
  # development is real wall-clock. sonnet stays the fallback in every chain.
  # (History: B/2026-06-25 had sonnet lead after a mimo-led leaf split the WSGI
  # app, v084 — since then the engine gained deterministic entry synthesis,
  # binding maps and the plan gate, which own that failure class.)
  tiers:
    weak:   {models: [xiaomimimo/mimo-v2.5, claude/sonnet], temperature: 0.2}
    medium: {models: [xiaomimimo/mimo-v2.5, claude/sonnet], temperature: 0.1}
    strong: {models: [xiaomimimo/mimo-v2.5-pro, claude/sonnet], temperature: 0.0}
  complexity_to_tier: {leaf_small: weak, leaf_big: medium, branch: strong}
  providers:
    # Xiaomi MiMo — its OWN Bifrost provider "xiaomimimo" (custom OpenAI-compatible,
    # base_url xiaomimimo.com, keys XIAOMIMIMO_API_KEY), routed by "xiaomimimo/" prefix.
    - {name: xiaomimimo, kind: openai, model_prefix: "xiaomimimo/", requests_per_day: 1000}
    # claude/* → subscription CLI (spends no API budget); used here for claude/sonnet.
    - {name: claude-cli, kind: claude, model_prefix: "claude/"}
  # ── SPEC-PIPELINE STAGES ────────────────────────────────────────────────
  # decompose → implement → review → verify. MIMO LEADS every stage (operator
  # request 2026-07-02: mimo carries no usage restriction and — unlike claude,
  # which Bifrost/Meridian serialise into ONE lane (provider_concurrency
  # claude:1) — mimo parallelises, so the engine's parallel node development
  # is real wall-clock, not just thread-structural). claude/sonnet stays in
  # every chain as the reliable fallback. verify keeps the strongest checker
  # (mimo-v2.5-pro).
  defaults:                             # shared chain when a stage adds no override
    models: ["xiaomimimo/mimo-v2.5", "claude/sonnet", "xiaomimimo/mimo-v2.5-pro"]
  stages:
    decompose:                          # build the tree → mimo leads; sonnet fallback
      models: ["xiaomimimo/mimo-v2.5", "claude/sonnet"]
    implement:                          # write the leaf → mimo leads; sonnet fallback
      models: ["xiaomimimo/mimo-v2.5", "claude/sonnet"]
      # team specialists: mimo everywhere (parallel-friendly); sonnet remains
      # the chain fallback via the stage models above. tester runs on a HERMES
      # agent, fixer on a MISSION-CONTROL agent (provider seam, §3/§4); secrets
      # are NEVER in this file — an unreachable service degrades to `model:`.
      team:
        specialists:
          - {role: architect, model: "xiaomimimo/mimo-v2.5", params: {temperature: 0.2}}
          - {role: coder,     model: "xiaomimimo/mimo-v2.5", params: {temperature: 0.4, max_tokens: 6000}}
          - {role: tester,    provider: hermes,          agent: "tester",
             gateway: "http://127.0.0.1:8642", model: "xiaomimimo/mimo-v2.5"}  # check via hermes seam → mimo
          - {role: fixer,     provider: mission-control, agent_template: "fixer",
             api: "http://127.0.0.1:3000", model: "xiaomimimo/mimo-v2.5-pro"}  # repair → strongest mimo
    review:                             # CHECK → mimo leads (sharp judge); sonnet fallback
      models: ["xiaomimimo/mimo-v2.5", "claude/sonnet"]
      # Service stage: the output is a strict-JSON verdict — model thinking
      # buys nothing here and burns time/quota (mimo is a reasoning model).
      # "off" is quoted: bare YAML `off` parses as boolean False. Translated
      # per provider at the single request-body seam (llm_backend).
      params: {reasoning: "off"}
    verify:                             # CHECK / final gate → STRONGEST mimo-v2.5-pro leads; sonnet fallback
      models: ["xiaomimimo/mimo-v2.5-pro", "claude/sonnet"]
      # Same rationale as review: a strict check verdict, not generation.
      params: {reasoning: "off"}
  #
  #  review: # CHECK → strong (mimo-v2.5) leads; haiku fallback
  #    models: [ "xiaomimimo/mimo-v2.5", "claude/haiku", "openrouter/qwen/qwen3-next-80b-a3b-instruct:free" ]
  #  verify:                             # CHECK / final gate → strongest (mimo-pro) leads
  #    models: [ "xiaomimimo/mimo-v2.5-pro", "xiaomimimo/mimo-v2.5", "claude/haiku" ]
  # SONNET-PRIMARY (diagnostic — commented): sonnet via claude-cli subscription.
  # defaults: {models: ["claude/sonnet", "openrouter/qwen/qwen3-coder:free", "claude/haiku"]}
  # stages:
  #   decompose: {models: ["claude/sonnet", "openrouter/qwen/qwen3-next-80b-a3b-instruct:free", "claude/haiku"]}
  #   implement: {models: ["claude/sonnet", "openrouter/qwen/qwen3-coder:free", "claude/haiku"]}
  #   review:    {models: ["claude/sonnet", "claude/haiku"]}
  #   verify:    {models: ["claude/sonnet", "claude/haiku"]}
