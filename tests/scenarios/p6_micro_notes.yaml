# Project 6 — the MINIMAL end-to-end case. Its only purpose is to exercise the
# whole live pipeline in the least wall-clock time:
#   * fsm engine + an LLM-built tree (no blueprint)
#   * a real code build verified by pytest at execute depth
#   * a mid-run HITL requirement injection (web_ui) that must materialise
#   * a working server-rendered web UI delivered at the root
# The product surface is deliberately tiny (a 2-endpoint notes service) so the
# tree the model builds is small — fewer nodes ⇒ fewer spec reviews, which the
# ⏱ analysis showed is ~47% of wall-clock. Depth/width are NOT hard-capped;
# the small goal keeps the tree small on its own.
#
# Nothing is seeded — no skeleton, no ready-made code. The `acceptance:` block
# is the declarative oracle (success criteria), not an implementation. Workers
# build the whole service themselves; this measures real, unaided capability.
name: p6-micro-notes
node_engine: fsm

goal: >
  A tiny notes service. Two HTTP endpoints over a WSGI app:
  POST /notes accepts {"text": "..."} and stores it, returning {"id": <int>};
  GET /notes returns {"items": [{"id": <int>, "text": "..."}]} newest-first.
  Persistence is sqlite3; standard library only.

target: >
  POST then GET round-trips a note; the service starts and answers GET /health
  with 200. Binary success — the acceptance suite is green on the assembled app.

policy: {measurable_target: true, spend_per_action_usd: 0, human_in_loop: true,
         involves_outreach: false, consent_obtained: true, legal_exposure: false,
         legality_reviewed: true}

constitution:
  - "Standard library ONLY: HTTP through a WSGI app (src/app.py exposes
     `wsgi_app`), storage through sqlite3 in src/db.py. No third-party packages."
  - "The product API contract is FROZEN: POST /notes takes {text} and responds
     {id}; GET /notes responds {items: [{id, text}]} newest-first; GET /health
     responds 200. Accept exactly these fields — no extras required."
  - "Every test sets the NOTES_DB env var to a fresh temp path BEFORE connecting
     (db.connect reads it per call)."

# HITL: autonomous approval; workers may ask the human, the human may inject.
hitl:
  approve_required: false
  worker_may_ask_human: true
  human_may_intervene: true

# Autonomous HITL script — replayed by the dispatcher (tests/lib/hitl_dispatcher.py)
# so no human babysits the run. A human in HITL only states a requirement IN WORDS;
# proving it works is the SYSTEM's job (the worker writes the leaf AND its test,
# the root corpus runs it). So the injection carries ONLY a prose `statement:` —
# the same thing a person would type in the HITL box. No handed pytest.
injections:
  requirements:
    - name: web_ui
      # Fire on the FIRST leaf implementation — reliable on any tree size, and
      # before the root integrate so the UI is part of the final product.
      # (integrate_passes:N is unreachable on a tiny tree with a single
      # root-level integrate, so the injection would never materialise.)
      when: {event: "minimal impl"}
      # The prose requirement a human would type (→ REQUIREMENT.md). What the
      # success looks like is stated in WORDS; the system must build it and
      # prove it works on its own.
      statement: |
        MINIMAL WEB INTERFACE (added by the human mid-run; binding).

        Serve a server-rendered HTML page, standard library only, as one feature
        leaf (src/web_ui.py) reusing the existing notes storage and /notes logic:

        - GET /ui  — an HTML page that lists all notes (newest first) and carries
                     an add form: a text input named "text" that POSTs back to /ui
                     and then shows the new note in the list.

        The WSGI app passes HTML strings through (return 200 + "<html>...").
        No JavaScript frameworks, no new storage, no API changes.

        Build it AND prove it works as part of the product — a page that serves
        HTML at /ui, shows the add form, and lists a note created through it.
    # SECOND human injection about the SAME web surface — fires LATER (after a
    # subtree integrate, so the web page already exists). The point of the
    # experiment: does the worker DISCOVER the existing /ui page and EDIT it in
    # place to satisfy this, or does it spawn a SECOND parallel web? Prose only.
    - name: nice_ui
      # Same early trigger as web_ui: both must arrive BEFORE the root places
      # its children (a requirement injected after that phase is orphaned —
      # the engine reads standing requirements once). Within the placement
      # loop they are visited in injection order, so web_ui is fully built
      # before nice_ui's worker runs — nice_ui therefore meets an existing
      # web_ui.py and we can see whether it EDITS it or builds a parallel web.
      when: {event: "minimal impl"}
      # DELIBERATELY worded WITHOUT an easy UI marker — no "/ui", no "web", no
      # "ui", no filename. It only refers to the notes the reader sees. This
      # forces the engine's UNIVERSAL surface-overlap detectors (symbol/token
      # overlap, not a UI keyword list) to find the module that already renders
      # notes and route this edit INTO it — proving the match is not a /ui cheat.
      statement: |
        MAKE THE NOTES NICE TO READ (added by the human mid-run; binding).

        The notes that a reader sees should be presented in a clean, friendly,
        easy-to-read layout — a clear heading, a tidy list, a simple way to add
        one. Standard library only; improve the existing presentation rather
        than adding a separate one alongside it.
  # Possible HUMAN answers — handed to the plugin ONLY when a worker actually
  # asks a question, and only the one whose `match` is found in that question
  # (else `default`). Never pushed proactively; one reply per real question.
  answers:
    default: "Proceed with the simplest correct standard-library approach; do not block on this."
    faq:
      - {match: "port", reply: "Any free localhost port is fine; tests drive the WSGI app directly, no real socket needed."}
      - {match: "framework", reply: "Standard library only — no Flask/Django. Plain WSGI, return HTML strings."}
      - {match: "storage", reply: "Reuse the existing notes storage (src/db.py) and the /notes logic; do not add new storage."}
      - {match: "database", reply: "Reuse the existing sqlite storage via src/db.py; no schema changes."}
      - {match: "form", reply: "A plain HTML <form> that POSTs to /ui with one text input named \"text\"; no JavaScript."}
      - {match: "field", reply: "The text input is named exactly \"text\"."}
      - {match: "order", reply: "List notes newest-first, same as GET /notes."}
      - {match: "path", reply: "Serve the page at GET /ui; the JSON API stays at /notes."}
      - {match: "json", reply: "/ui returns HTML (text/html), not JSON; JSON stays at /notes."}
      - {match: "file", reply: "Put it in src/web_ui.py as one feature leaf."}

# Review policy: rework to green, but a tight cap — review + repair are the
# two biggest time sinks, so bound them and let the gate fail loudly instead
# of grinding rounds.
review:
  on_reject: rework
  max_rework: 2

# Acceptance oracle (declarative). The assembled app must satisfy these; the
# verifier turns them into the root gate. web_ui acceptance arrives mid-run via
# the HITL requirement injection, not here.
acceptance:
  smoke:
    - "service starts and answers GET /health -> 200"
  e2e:
    - "POST /notes {text:'hi'} -> {id}; GET /notes -> items contains that note"

# Workers: self-contained run config (transport + free model chains + knobs),
# tuned for minimum time. Applied over the tests/.test.env floor.
workers:
  backend: openai                       # Bifrost speaks the OpenAI protocol
  base_url: http://127.0.0.1:8080/v1
  retries: 6
  leaf_depth: 3
  max_children: 3
  max_decompose_calls: 40
  creator_ensemble: 2
  concurrency: 3
  # cycle_models: false                 # ← SONNET diagnostic (restore with SONNET block)
  cycle_models: true                    # FREE-PRIMARY: round-robin across free models
  quota_wait_s: 300
  quota_retries: 11
  fallback_models: [claude/haiku]
  providers:
    - {name: openrouter-free, kind: openai, model_prefix: "openrouter/", require_suffix: ":free", requests_per_day: 1000}
    - {name: claude-cli, kind: claude, model_prefix: "claude/"}
  # ── MODEL CHAINS ───────────────────────────────────────────────────────
  # SWITCH: free-primary is ACTIVE. To force sonnet (diagnostic), comment the FREE
  # block and uncomment the SONNET block below (and set cycle_models: false above).
  #
  # FREE-PRIMARY (ACTIVE — free OpenRouter primary, haiku fallback):
  defaults:
    models: ["openrouter/qwen/qwen3-coder:free", "claude/haiku"]
  decomposer:
    models: ["openrouter/qwen/qwen3-next-80b-a3b-instruct:free", "claude/haiku"]
  implementer:
    models: ["openrouter/qwen/qwen3-coder:free", "openrouter/deepseek/deepseek-chat-v3.1:free", "claude/haiku"]
    # D1: implementer orchestra — architect → coder → tester → fixer (free model).
    team:
      - {role: architect}
      - {role: coder}
      - {role: tester}
      - {role: fixer}
  reviewer:
    models: ["claude/haiku", "openrouter/qwen/qwen3-next-80b-a3b-instruct:free"]
  verifier:
    models: ["claude/haiku", "openrouter/qwen/qwen3-coder:free"]
  #
  # SONNET-PRIMARY (diagnostic — commented): sonnet via claude-cli subscription.
  # defaults:   {models: ["claude/sonnet", "openrouter/qwen/qwen3-coder:free", "claude/haiku"]}
  # decomposer: {models: ["claude/sonnet", "openrouter/qwen/qwen3-next-80b-a3b-instruct:free", "claude/haiku"]}
  # implementer:{models: ["claude/sonnet", "openrouter/qwen/qwen3-coder:free", "claude/haiku"]}
  # reviewer:   {models: ["claude/sonnet", "claude/haiku"]}
  # verifier:   {models: ["claude/sonnet", "claude/haiku"]}
